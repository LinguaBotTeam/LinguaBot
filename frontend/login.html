<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — LinguaBot</title>
  <script>
    try {
      if (localStorage.getItem('linguabot-theme') === 'light') {
        document.documentElement.dataset.theme = 'light';
      }
    } catch {}
  </script>
  <link rel="stylesheet" href="./src/styles/style.css">
  <link rel="stylesheet" href="./src/styles/auth.css">
</head>
<body>
  <header class="header container">
    <a class="logo" href="./index.html"><span aria-hidden="true">L</span> LinguaBot</a>
    <div class="header-actions">
      <a class="nav-link" href="./index.html">На главную</a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Включить светлую тему">
        <span id="theme-icon" aria-hidden="true">☀</span>
        <span id="theme-label">Светлая тема</span>
      </button>
    </div>
  </header>

  <main class="auth container">
    <section class="auth-card" aria-labelledby="auth-title">
      <h1 id="auth-title">Вход в аккаунт</h1>
      <p class="auth-subtitle">Продолжай обучение с того места, где остановился.</p>

      <form class="form" data-auth-form="login" novalidate>
        <p class="form-error" data-auth-error role="alert" hidden></p>
        <p class="form-success" data-auth-success role="status" hidden></p>

        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label for="login-password">Пароль</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Ваш пароль" minlength="8" required>
        </div>

        <button class="button" type="submit">Войти</button>
      </form>

      <p class="auth-alt">Нет аккаунта? <a href="./register.html">Зарегистрироваться</a></p>
    </section>
  </main>

  <footer class="footer container">LinguaBot · Языки становятся ближе</footer>

  <script src="./src/api/client.js"></script>
  <script src="./src/app/script.js"></script>
  <script src="./src/app/auth-page.js"></script>
</body>
</html>
